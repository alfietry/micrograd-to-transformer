[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mg2t"
version = "0.1.0"
description = "From a scalar autograd engine to a small GPT, built from scratch"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "alfietry" }]
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "matplotlib",
  "pyyaml",
  "tqdm",
  "torch",
  "tensorboard",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
